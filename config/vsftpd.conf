# ===============================
# Authenticated access only
# ===============================

listen=YES
# FTP listens on IPv4.

listen_ipv6=NO
# Disable IPv6 listening (keeps setup simple).

anonymous_enable=NO
# Disable anonymous FTP for security.

local_enable=YES
# Allow real Linux users to log in.

write_enable=YES
# Allow upload, rename, and delete actions.

chroot_local_user=YES
# Lock users in their home directory for safety.

allow_writeable_chroot=YES
# Needed so users can write while chrooted.

pasv_enable=YES
# Enable passive mode (needed behind NAT or firewalls).

pasv_min_port=40000
pasv_max_port=40100
# Passive mode port range—keeps firewall rules simple.

xferlog_enable=YES
# Log all uploads/downloads.

xferlog_std_format=NO
# Use modern logging format.

xferlog_file=/var/log/vsftpd.log
# Where logs are saved.

dirmessage_enable=YES
# Show messages from .message files when entering directories.

use_localtime=YES
# Show times based on server’s local timezone.

connect_from_port_20=YES
# Data connections come from port 20 (standard FTP behavior).

secure_chroot_dir=/var/run/vsftpd/empty
# Safe directory for vsftpd to use when chrooting.

pam_service_name=vsftpd
# Use the correct PAM authentication profile.

ssl_enable=NO
# SSL/TLS disabled (simple setup).
