# DHCP configuration for student22503.lan

option domain-name "student22503.lan";
# Sets the domain name given to clients.

option domain-name-servers 192.168.56.10;
# Tells clients to use your DNS server.

default-lease-time 86400;
# Lease lasts 24 hours by default.

max-lease-time 86400;
# Maximum lease time also 24 hours (keeps things simple for tests).

ddns-update-style none;
# Disable dynamic DNS updates (common for simple setups).

authoritative;
# This DHCP server is the main and correct one for this network.

subnet 192.168.56.0 netmask 255.255.255.0 {
    range 192.168.56.150 192.168.56.200;
    # Clients will get IPs between 150 and 200.

    option routers 192.168.56.10;
    # Default gateway for clients (your server/router).

    option broadcast-address 192.168.56.255;
    # Standard broadcast address for this subnet.
}
